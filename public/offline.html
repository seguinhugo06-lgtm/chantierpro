<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hors ligne - Mallettico</title>
    <meta name="theme-color" content="#12336F" />
    <!-- Charte « Glacier vif » (Task 5 « ancien code », 25 oct. 2026) : glacier et bleu nuit du logo, l'orange du logo en
         décor seulement ; sombre bleu-noir quand le téléphone est en mode sombre. Page autonome : aucune ressource externe. -->
    <style>
      :root {
        --fond: #F0FAFF;
        --surface: #FFFFFF;
        --bord: #E1EBF3;
        --encre: #0F172A;
        --encre-2: #475569;
        --accent: #12336F;
        --sur-accent: #FFFFFF;
        --accent-texte: #12336F;
        --alerte-fond: #FEF3C7;
        --alerte-texte: #92400E;
        --signature: #EE7B20;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #0B1324;
          --surface: #14213A;
          --bord: #24365A;
          --encre: #F8FAFC;
          --encre-2: #CBD5E1;
          --accent: #3A6BC4; /* blanc 5,3:1 dessus, 3,5:1 sur le fond */
          --accent-texte: #BFF2FF;
          --alerte-fond: #451A03;
          --alerte-texte: #FCD34D;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--fond);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        color: var(--encre);
      }

      .container {
        text-align: center;
        max-width: 400px;
        width: 100%;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        font-size: 24px;
        font-weight: 800;
        color: var(--accent-texte);
      }

      .logo-point {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: var(--signature);
        box-shadow: 0 0 10px rgba(238, 123, 32, 0.6);
      }

      .icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        background: var(--surface);
        border: 1px solid var(--bord);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 48px;
        height: 48px;
        color: var(--encre-2);
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      p {
        font-size: 16px;
        color: var(--encre-2);
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: var(--alerte-fond);
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        color: var(--alerte-texte);
        margin-bottom: 32px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: currentColor;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 12px 24px;
        border-radius: 9999px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        border: none;
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent-texte);
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--sur-accent);
      }

      .btn-primary:hover {
        filter: brightness(0.95);
      }

      .btn-secondary {
        background: var(--surface);
        color: var(--encre);
        border: 1px solid var(--bord);
      }

    </style>
  </head>
  <body>
    <main class="container">
      <div class="logo"><span class="logo-point" aria-hidden="true"></span>Mallettico</div>

      <div class="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3" />
        </svg>
      </div>

      <h1>Vous êtes hors ligne</h1>
      <!-- Cette page ne s'affiche que si l'app n'a pas pu se charger : elle ne promet rien d'autre que ce qu'elle fait
           (relecture du 25 oct. 2026 : elle listait « devis en brouillon, clients, photos, catalogue » disponibles) -->
      <p>
        Pas de connexion internet détectée. Cette page se recharge d'elle-même au retour du réseau.
      </p>

      <div class="status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        En attente de connexion
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="button" onclick="window.location.reload()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Réessayer
        </button>
        <a href="/" class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Retour à l'accueil
        </a>
      </div>

    </main>

    <script>
      // Auto-reload when back online
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
